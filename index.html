<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pinger Stabilizer</title>
<style>
  :root {
    --bg: #000000;
    --surface: #0e0e10;
    --border: #222226;
    --text: #ffffff;
    --muted: #88888c;
    --accent: #22c55e;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
  body { background: var(--bg); color: var(--text); padding: 12px; max-width: 500px; margin: 0 auto; }
  
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  
  /* Status Header */
  .status-badge { font-size: 11px; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border); color: var(--muted); }
  .status-badge.active { color: var(--accent); border-color: var(--accent); }

  /* Stats Grid */
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; margin-bottom: 10px; }
  .stat-box { background: var(--bg); border: 1px solid var(--border); padding: 8px; border-radius: 4px; }
  .stat-val { font-size: 18px; font-weight: bold; margin-top: 2px; }
  .stat-lbl { font-size: 10px; color: var(--muted); }

  /* Inputs & Controls */
  input, select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 13px; outline: none; }
  .btn { width: 100%; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 14px; border: none; cursor: pointer; margin-bottom: 8px; }
  .btn-start { background: var(--text); color: var(--bg); }
  .btn-stop { background: var(--danger); color: #fff; }

  /* Checkbox / Mode Toggles */
  .toggle-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .toggle-row input { width: auto; margin: 0; }

  /* Terminal Log Box */
  .log-box { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px; height: 160px; overflow-y: auto; font-size: 11px; color: #a1a1aa; line-height: 1.4; }
  .log-item { margin-bottom: 3px; border-bottom: 1px solid #111; padding-bottom: 2px; }
  .log-ok { color: var(--accent); }
  .log-err { color: var(--danger); }
</style>
</head>
<body>

  <!-- STATUS CARD -->
  <div class="card">
    <div class="row">
      <span style="font-weight:bold; font-size:14px;">NET_STABILIZER</span>
      <span id="statusBadge" class="status-badge">IDLE</span>
    </div>
    
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-lbl">CURRENT</div>
        <div class="stat-val" id="currPing">0ms</div>
      </div>
      <div class="stat-box">
        <div class="stat-lbl">AVERAGE</div>
        <div class="stat-val" id="avgPing">0ms</div>
      </div>
      <div class="stat-box">
        <div class="stat-lbl">FAILED</div>
        <div class="stat-val" id="failCount" style="color:var(--danger)">0</div>
      </div>
    </div>
  </div>

  <!-- CONTROLS CARD -->
  <div class="card">
    <label style="font-size:11px; color:var(--muted);">TARGET URL / HOST</label>
    <input type="text" id="targetUrl" value="https://selfcare.hutch.lk">

    <label style="font-size:11px; color:var(--muted);">PING INTERVAL / MODE</label>
    <select id="intervalMode">
      <option value="1000">Fast (1.0s)</option>
      <option value="3000" selected>Balanced (3.0s)</option>
      <option value="5000">Battery Saver (5.0s)</option>
      <option value="RANDOM">Random Interval (2s - 6s)</option>
    </select>

    <div class="toggle-row">
      <input type="checkbox" id="batterySaver" checked>
      <label for="batterySaver">Max Battery & RAM Saver (Throttle UI logging)</label>
    </div>

    <button class="btn btn-start" id="mainBtn" onclick="togglePinger()">START STABILIZER</button>
  </div>

  <!-- LOGS CARD -->
  <div class="card" style="margin-bottom:0;">
    <div class="row" style="margin-bottom:4px;">
      <span style="font-size:11px; color:var(--muted);">LIVE EVENT LOG</span>
      <span style="font-size:11px; color:var(--muted); cursor:pointer;" onclick="clearLogs()">CLEAR</span>
    </div>
    <div class="log-box" id="logBox">
      <div class="log-item">> System ready. Tap Start.</div>
    </div>
  </div>

<script>
  let isRunning = false;
  let timer = null;
  let pings = [];
  let fails = 0;

  function log(msg, type = '') {
    const box = document.getElementById('logBox');
    const time = new Date().toTimeString().split(' ')[0];
    const cls = type === 'ok' ? 'log-ok' : type === 'err' ? 'log-err' : '';
    
    // In battery saver mode, only log errors or every 5th ping to save RAM
    const isBatterySaver = document.getElementById('batterySaver').checked;
    if (isBatterySaver && type === '' && Math.random() > 0.2) return;

    box.innerHTML = `<div class="log-item ${cls}">[${time}] ${msg}</div>` + box.innerHTML;
    
    // Keep max 50 logs to prevent memory bloat on Vivo Y1s
    if (box.children.length > 50) box.removeChild(box.lastChild);
  }

  function clearLogs() {
    document.getElementById('logBox.innerHTML') = '';
    document.getElementById('logBox').innerHTML = '<div class="log-item">> Logs cleared.</div>';
  }

  function togglePinger() {
    if (isRunning) {
      stopPinger();
    } else {
      startPinger();
    }
  }

  function startPinger() {
    const url = document.getElementById('targetUrl').value.trim();
    if (!url) { alert('Please enter a target URL'); return; }

    isRunning = true;
    const btn = document.getElementById('mainBtn');
    btn.textContent = 'STOP STABILIZER';
    btn.className = 'btn btn-stop';
    document.getElementById('statusBadge.className') = 'status-badge active';
    document.getElementById('statusBadge').textContent = 'ACTIVE';
    document.getElementById('statusBadge').className = 'status-badge active';

    pings = [];
    fails = 0;
    log('Stabilizer started targeting: ' + url, 'ok');
    
    executePing(url);
  }

  function stopPinger() {
    isRunning = false;
    if (timer) clearTimeout(timer);
    
    const btn = document.getElementById('mainBtn');
    btn.textContent = 'START STABILIZER';
    btn.className = 'btn btn-start';
    const badge = document.getElementById('statusBadge');
    badge.textContent = 'IDLE';
    badge.className = 'status-badge';
    
    log('Stabilizer stopped.');
  }

  function executePing(url) {
    if (!isRunning) return;

    const start = performance.now();
    // Using no-cors or image/fetch trick to test connection latency
    fetch(url + (url.includes('?') ? '&' : '?') + '_t=' + Date.now(), { mode: 'no-cors', cache: 'no-store' })
      .then(() => {
        if (!isRunning) return;
        const latency = Math.round(performance.now() - start);
        pings.push(latency);
        if (pings.length > 20) pings.shift(); // keep rolling average window

        const avg = Math.round(pings.reduce((a,b)=>a+b, 0) / pings.length);
        
        document.getElementById('currPing').textContent = latency + 'ms';
        document.getElementById('avgPing').textContent = avg + 'ms';
        log(`Ping OK: ${latency}ms (Avg: ${avg}ms)`, 'ok');

        scheduleNext(url);
      })
      .catch(() => {
        if (!isRunning) return;
        fails++;
        document.getElementById('failCount').textContent = fails;
        log(`Ping failed / Timeout`, 'err');

        scheduleNext(url);
      });
  }

  function scheduleNext(url) {
    if (!isRunning) return;

    const mode = document.getElementById('intervalMode').value;
    let delay = 3000;

    if (mode === 'RANDOM') {
      // Random interval between 2000ms and 6000ms to save data & battery
      delay = Math.floor(Math.random() * 4000) + 2000;
    } else {
      delay = parseInt(mode);
    }

    timer = setTimeout(() => executePing(url), delay);
  }
</script>
</body>
</html>
